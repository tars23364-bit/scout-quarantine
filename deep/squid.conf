# Egress proxy for the deep reviewer box. The reviewer sits on a Docker --internal network and
# this proxy is its only way out. Policy: CONNECT to port 443 of an exact allowlisted host,
# nothing else. `dstdomain` without a leading dot is an exact-host match, so
# api.anthropic.com.evil.example and evil.api.anthropic.com do not match.
#
# The allowlist file is mounted read-only at runtime (one host per line); the default holds
# only the model API host.

http_port 3128

acl allowed_hosts dstdomain "/etc/squid/allowlist.txt"
acl tls_port port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny !tls_port
http_access allow CONNECT allowed_hosts
http_access deny all

# One line per request, allowed and denied, to stdout (collected via `docker logs`).
# Fields: time  client  method  target  http-status  squid-result  bytes
logformat deep %{%Y-%m-%dT%H:%M:%S%z}tl %>a %rm %ru %>Hs %Ss %<st
access_log stdio:/dev/stdout deep
cache_log stdio:/dev/stderr
cache_store_log none

# No caching, no disk state: root fs is read-only and nothing should persist between runs.
cache deny all
cache_mem 8 MB
pid_filename none
coredump_dir /tmp

# Do not reveal the client or the proxy to the upstream.
forwarded_for delete
via off
httpd_suppress_version_string on
shutdown_lifetime 1 seconds
